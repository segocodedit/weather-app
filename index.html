<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="stylesheet" href="styles.css" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&display=swap"
      rel="stylesheet"
    />
    <title>Weather App</title>
  </head>
  <body>
    <div class="weather-app">
      <header>
        <form>
          <input type="search" placeholder="Enter a city" required />
          <input type="submit" value="search" />
        </form>
      </header>

      <main>
        <div>
          <h1>Paris</h1>
          <p>
            Tuesday 14:49, Scattered clouds
            <br />
            Humidity: 66%, Wind: 3.13km/h
          </p>
        </div>

        <div>⛅ 24°C</div>
      </main>

      <footer>
        Coded by
        <a href="https://github.com/segocodedit" target="_blank">Masego</a> Code
        hosted on
        <a href="https://github.com/segocodedit/weather-app.git" target="_blank"
          >Github</a
        >
        Website hosted on
        <a href="https://mutsho.netlify.app/" target="_blank">Netlify</a>
      </footer>
    </div>
  </body>
</html>
